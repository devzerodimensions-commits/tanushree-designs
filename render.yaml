# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Creates the web service. In Render, choose "New +" -> "Blueprint" and
# point it at this repository.
#
# Runs entirely on Render's free plan.
#
# The database is NOT created here. Render allows only one free PostgreSQL
# per account, so this expects an external Postgres (Neon, Supabase, Aiven
# or an existing Render database) supplied as DATABASE_URL. Render will
# prompt for it when you apply the blueprint.
#
# Note on uploads: with no disk attached, Render's filesystem is wiped on
# every deploy, so images added through the admin Media Library do not
# survive a redeploy. The seeded photography is unaffected — it ships in
# client/public/images as part of the build. To make uploads permanent later,
# either attach a disk (paid) or host them externally; the image fields in
# the admin already accept a URL. See the README.

services:
  - type: web
    name: tanushree-designs
    runtime: node
    plan: free
    region: singapore # closest Render region to Ahmedabad
    branch: main

    buildCommand: npm run render-build
    startCommand: npm start

    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: NODE_VERSION
        value: "22"

      # Paste your Postgres connection string when Render asks. It must
      # include ?sslmode=require for a hosted provider such as Neon.
      - key: DATABASE_URL
        sync: false

      - key: PGSSL
        value: "true"

      # Apply schema.sql on boot so a fresh database sets itself up.
      - key: RUN_MIGRATIONS
        value: "true"

      # Signing key for admin sessions — generated once by Render.
      - key: JWT_SECRET
        generateValue: true

      - key: JWT_EXPIRES_IN
        value: 7d

      # The API and the site are the same origin in production, so this only
      # matters if you ever serve the front end from somewhere else.
      - key: CLIENT_ORIGIN
        fromService:
          type: web
          name: tanushree-designs
          envVarKey: RENDER_EXTERNAL_URL

      # Makes uploaded image URLs absolute and correct.
      - key: PUBLIC_URL
        fromService:
          type: web
          name: tanushree-designs
          envVarKey: RENDER_EXTERNAL_URL

      - key: MAX_UPLOAD_MB
        value: "8"

      - key: CACHE_TTL_MS
        value: "60000"

      # The free plan stops a service after 15 quiet minutes, and the next
      # visitor waits out the wake-up. Setting this to the site's own address
      # makes it ping itself and stay up. It then burns free instance-hours
      # continuously — about a month's allowance for one service — so it is
      # left unset, and deliberately turned on in the Render dashboard.
      - key: KEEP_AWAKE_URL
        sync: false

      # First admin account. Change the password from Settings -> Account
      # as soon as you have signed in for the first time.
      - key: ADMIN_NAME
        value: Tanushree Admin
      - key: ADMIN_EMAIL
        value: admin@tanushreedesigns.in
      - key: ADMIN_PASSWORD
        sync: false # Render prompts you for this; it is never stored in git.
