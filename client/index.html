<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7D1416" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Modular Kitchen &amp; Elica Kitchen Chimney | Tanushree Designs</title>
    <meta
      name="description"
      content="Modular kitchens, wardrobes and turnkey home interiors in Ahmedabad. 850+ homes delivered, 10-year structural warranty, authorised Elica partner."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />

    <!--
      DM Sans is a variable font, so one 400..700 range replaces four static
      cuts; Unna only needs regular and bold, and no italic is used anywhere.
      Loaded with media="print" so it never blocks the first paint, then
      switched to all from main.jsx (an inline onload handler would be
      blocked by our Content-Security-Policy). display=swap keeps text
      visible with the fallback face meanwhile.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=Unna:wght@400;700&display=swap"
    />
    <link
      rel="stylesheet"
      data-font-css
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=Unna:wght@400;700&display=swap"
      media="print"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=Unna:wght@400;700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
